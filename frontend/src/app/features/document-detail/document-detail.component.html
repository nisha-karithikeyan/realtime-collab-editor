<header class="topbar">
  <a routerLink="/documents" class="back">← My documents</a>
</header>

<main>
  @if (loadFailed()) {
    <p class="banner error" role="alert">
      Couldn't load this document. It may have been deleted, or you may not have access to it.
    </p>
  } @else if (document()) {
    <h1>{{ document()!.title }}</h1>
    <p class="placeholder-note">
      The real-time collaborative editor for this document lands in the next build slice.
    </p>
  } @else {
    <app-loading-skeleton [rows]="2" [widths]="[40, 90]"></app-loading-skeleton>
  }
</main>
